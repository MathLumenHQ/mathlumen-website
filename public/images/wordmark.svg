<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="190" viewBox="0 0 820 190" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">MathLumen - Illuminating Mathematics</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#06080f"/>
    </linearGradient>
    <!-- animated gold shimmer on "Lumen" -->
    <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="380" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#b8862b"/>
      <stop offset="0.35" stop-color="#f6d98b"/>
      <stop offset="0.65" stop-color="#e8b84b"/>
      <stop offset="1" stop-color="#b8862b"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="380 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8b84b" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#e8b84b" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#e8b84b" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <!-- dark panel so the white "Math" stays readable on GitHub light and dark themes -->
  <rect width="820" height="190" rx="18" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="819" height="189" rx="17.5" fill="none" stroke="#e8b84b" stroke-opacity="0.25"/>

  <!-- soft pulsing glow behind the word -->
  <text x="410" y="112" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="100" font-weight="700" fill="#e8b84b" filter="url(#blur)" opacity="0.3">Math<tspan>Lumen</tspan>
    <animate attributeName="opacity" values="0.18;0.42;0.18" dur="4s" repeatCount="indefinite"/>
  </text>

  <!-- wordmark -->
  <text x="410" y="112" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="100" font-weight="700" fill="#f2ede4">Math<tspan fill="url(#shine)">Lumen</tspan></text>

  <rect x="190" y="130" width="440" height="2" fill="url(#rule)"/>
  <text x="410" y="164" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="19" letter-spacing="8" fill="#f2ede4" fill-opacity="0.75">ILLUMINATING MATHEMATICS</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
