<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#06080f"/>

  <!-- Gold border accent lines -->
  <rect x="0" y="0" width="1200" height="3" fill="#c9a84c"/>
  <rect x="0" y="627" width="1200" height="3" fill="#c9a84c"/>

  <!-- Decorative math symbols (subtle, low opacity) -->
  <text x="80" y="180" font-family="Georgia, serif" font-size="120" fill="#c9a84c" opacity="0.06">∑</text>
  <text x="980" y="520" font-family="Georgia, serif" font-size="100" fill="#c9a84c" opacity="0.06">∫</text>
  <text x="60" y="560" font-family="Georgia, serif" font-size="80" fill="#c9a84c" opacity="0.05">π</text>
  <text x="1060" y="140" font-family="Georgia, serif" font-size="80" fill="#c9a84c" opacity="0.05">∞</text>

  <!-- Logo mark — gold circle with M -->
  <circle cx="600" cy="220" r="52" fill="none" stroke="#c9a84c" stroke-width="2" opacity="0.6"/>
  <text x="600" y="238" font-family="Georgia, serif" font-size="48" font-weight="700" fill="#c9a84c" text-anchor="middle">M</text>

  <!-- Site name -->
  <text x="600" y="340" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="700" fill="#f5f0e8" text-anchor="middle" letter-spacing="2">MathLumen</text>

  <!-- Gold separator -->
  <rect x="480" y="368" width="240" height="1" fill="#c9a84c" opacity="0.5"/>

  <!-- Tagline -->
  <text x="600" y="415" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#f5f0e8" text-anchor="middle" opacity="0.7" font-style="italic">Illuminating Mathematics</text>

  <!-- URL watermark -->
  <text x="600" y="560" font-family="monospace, 'Courier New'" font-size="18" fill="#6b6560" text-anchor="middle" letter-spacing="1">mathlumen.com</text>
</svg>
